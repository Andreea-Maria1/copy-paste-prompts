<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copy Prompt</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; padding: 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; max-width: 900px; }
    textarea { width: 100%; height: 320px; margin: 10px 0; padding: 10px; border-radius: 10px; border: 1px solid #ccc; }
    .row { display: flex; align-items: center; gap: 10px; }
    button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; cursor: pointer; }
    #status { font-size: 14px; opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Daily Project Briefing Prompt</h2>
    <div style="opacity:.75;margin-top:-6px">Click Copy. Then paste anywhere.</div>

    <textarea id="prompt" readonly></textarea>

    <div class="row">
      <button id="copyBtn">Copy prompt</button>
      <span id="status" aria-live="polite"></span>
    </div>
  </div>

  <script>
    const PROMPT_TEXT = `Your objective is to generate a daily project briefing based on the most recent project activity, highlighting changes, signals, and execution-relevant items.

This is NOT a status report.

This is a daily execution awareness tool.

**PHASE 1 – CONTEXT (IMPLICIT)**

The project context is already defined.

You have access to:

- Recent meeting transcripts (last 24–72 hours)
- Recent chats and written communications
- Open items discussed (decisions, risks, issues, actions)
- Upcoming milestones or meetings (if available)

Do NOT ask questions.

Proceed directly to analysis.

**PHASE 2 – DAILY BRIEFING GENERATION**

Using only available project data,

produce today’s Daily Project Briefing.

Focus on:

- what changed recently,
- what requires attention today,
- what is unclear or unresolved.

Do NOT repeat yesterday’s content unless nothing has changed

(in that case, state it explicitly).

**SECTION 1 – Project Snapshot (1 Sentence)**

Provide a single, factual sentence summarizing the current project situation

based on recent activity.

Rules:

- Neutral tone
- No speculation
- No jargon unless present in source material

**SECTION 2 – Key Developments (Max 3)**

Highlight the most important topics from recent discussions.

For each item:

- What changed or was discussed
- Why it matters for execution

Avoid exhaustive lists.

**SECTION 3 – Decisions & Open Questions**

Summarize decision-related items in the following table format:

| **Item** | **Status** | **Owner** | **Notes** |
| --- | --- | --- | --- |
| [Decision item] | Taken / Open | Named / Not defined | [Additional context] |

Only include items mentioned in recent activity.

**SECTION 4 – Risks, Concerns, or Blockers**

Summarize risks or concerns explicitly raised by participants.

Rules:

- No speculation
- No risk scoring
- If none were mentioned, state “No explicit risks raised.”

**SECTION 5 – Suggested Focus for Today**

Based on observed signals, suggest **1–2 focus areas** for today.

Rules:

- Phrase as guidance, not instructions
- Tie suggestions to observed data
- Do not introduce new topics

**STYLE & GUARDRAILS**

- Concise, executive-readable
- Bullet points preferred
- No PMO or methodological jargon unless present in sources
- No assumptions or invented data
- Explicitly flag uncertainty or missing information
- Prioritize clarity over completeness`;

    const promptEl = document.getElementById("prompt");
    const statusEl = document.getElementById("status");
    const copyBtn = document.getElementById("copyBtn");

    promptEl.value = PROMPT_TEXT;

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(PROMPT_TEXT);
        statusEl.textContent = "Copied ✅";
        setTimeout(() => statusEl.textContent = "", 1500);
      } catch (e) {
        promptEl.focus(); promptEl.select();
        document.execCommand("copy");
        statusEl.textContent = "Copied ✅";
        setTimeout(() => statusEl.textContent = "", 1500);
      }
    });
  </script>
</body>
</html>
