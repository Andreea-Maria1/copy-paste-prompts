<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copy Prompt</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; padding: 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 14px; max-width: 900px; }
    textarea { width: 100%; height: 320px; margin: 10px 0; padding: 10px; border-radius: 10px; border: 1px solid #ccc; }
    .row { display: flex; align-items: center; gap: 10px; }
    button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; cursor: pointer; }
    #status { font-size: 14px; opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Daily Project Briefing Prompt</h2>
    <div style="opacity:.75;margin-top:-6px">Click Copy. Then paste anywhere.</div>

    <textarea id="prompt" readonly></textarea>

    <div class="row">
      <button id="copyBtn">Copy prompt</button>
      <span id="status" aria-live="polite"></span>
    </div>
  </div>

  <script>
    const PROMPT_TEXT = `PASTE YOUR REAL PROMPT HERE
(keep it exactly as-is)
Line breaks are preserved.`;

    const promptEl = document.getElementById("prompt");
    const statusEl = document.getElementById("status");
    const copyBtn = document.getElementById("copyBtn");

    promptEl.value = PROMPT_TEXT;

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(PROMPT_TEXT);
        statusEl.textContent = "Copied ✅";
        setTimeout(() => statusEl.textContent = "", 1500);
      } catch (e) {
        promptEl.focus(); promptEl.select();
        document.execCommand("copy");
        statusEl.textContent = "Copied ✅";
        setTimeout(() => statusEl.textContent = "", 1500);
      }
    });
  </script>
</body>
</html>
